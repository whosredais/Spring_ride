<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Ajouter un véhicule</title>
</head>

<body>
    <div layout:fragment="content" class="max-w-2xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8 text-night">Ajouter un véhicule</h1>

        <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-100">
            <form th:action="@{/driver/vehicles/add}" th:object="${vehicleRequest}" method="post" class="space-y-6">

                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Marque</label>
                        <input type="text" th:field="*{brand}"
                            class="w-full px-4 py-2 border rounded-lg focus:ring-spring focus:border-spring"
                            placeholder="Ex: Peugeot" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Modèle</label>
                        <input type="text" th:field="*{model}"
                            class="w-full px-4 py-2 border rounded-lg focus:ring-spring focus:border-spring"
                            placeholder="Ex: 208" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Couleur</label>
                        <input type="text" th:field="*{color}"
                            class="w-full px-4 py-2 border rounded-lg focus:ring-spring focus:border-spring"
                            placeholder="Ex: Gris" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Année (Facultatif)</label>
                        <input type="number"
                            class="w-full px-4 py-2 border rounded-lg focus:ring-spring focus:border-spring"
                            placeholder="2020">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Immatriculation</label>
                        <input type="text" th:field="*{licensePlate}"
                            class="w-full px-4 py-2 border rounded-lg focus:ring-spring focus:border-spring uppercase"
                            placeholder="AB-123-CD" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nombre de places</label>
                        <input type="number" th:field="*{seats}" min="1" max="9"
                            class="w-full px-4 py-2 border rounded-lg focus:ring-spring focus:border-spring" value="4"
                            required>
                    </div>
                </div>

                <div class="bg-blue-50 p-4 rounded-lg flex items-start gap-3">
                    <svg class="w-5 h-5 text-blue-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <p class="text-sm text-blue-700">Ces informations seront visibles par les passagers lors de la
                        réservation.</p>
                </div>

                <!-- Bouton -->
                <button type="submit"
                    class="w-full bg-spring text-white font-bold py-3 rounded-lg hover:bg-green-600 transition shadow-md">
                    Enregistrer le véhicule
                </button>
            </form>
        </div>
    </div>
</body>

</html>
