<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Mes Trajets - Conducteur</title>
</head>

<body>
    <div layout:fragment="content" class="max-w-7xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-night mb-8">Gérer mes trajets</h1>

        <!-- Messages -->
        <div th:if="${success}"
            class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
            <span th:text="${error}"></span>
        </div>

        <div class="grid grid-cols-1 gap-6">
            <div th:each="trip : ${trips}" th:id="'trip-card-' + ${trip.id}"
                class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-4">

                <!-- Top Row: Info and Actions -->
                <div class="flex justify-between items-start">
                    <!-- Trip Info -->
                    <div>
                        <h3 class="text-xl font-bold text-night"
                            th:text="${trip.departureCity} + ' → ' + ${trip.arrivalCity}">Casablanca → Rabat</h3>
                        <p class="text-gray-500"
                            th:text="${#temporals.format(trip.departureDateTime, 'dd MMMM yyyy à HH:mm')}">14 Janvier
                            2025
                        </p>
                        <div class="mt-2 flex gap-2">
                            <span class="px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded-md"
                                th:text="${trip.availableSeats} + ' places restantes'">3 places restantes</span>
                            <span class="px-2 py-1 bg-blue-50 text-blue-600 text-xs rounded-md font-bold"
                                th:text="${trip.pricePerSeat} + ' DH'">25 DH</span>
                            <span
                                th:class="${'px-2 py-1 text-xs rounded-md font-bold ' + 
                                (trip.status.name() == 'PLANIFIE' ? 'bg-green-100 text-green-700' : 
                                 (trip.status.name() == 'ANNULE' ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-700'))}"
                                th:text="${trip.status}">PLANIFIE</span>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex gap-3" th:if="${trip.status.name() != 'ANNULE'}">
                        <a th:href="@{/driver/trips/{id}/edit(id=${trip.id})}"
                            class="text-gray-400 hover:text-spring transition font-semibold">
                            Modifier
                        </a>

                        <form th:action="@{/driver/trips/{id}/cancel(id=${trip.id})}" method="post"
                            onsubmit="return confirm('Êtes-vous sûr de vouloir annuler ce trajet ?')">
                            <button type="submit" class="text-red-400 hover:text-red-600 transition font-semibold">
                                Annuler
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Passenger List Section -->
                <div class="pt-4 border-t border-gray-100" th:if="${!trip.reservations.isEmpty()}">
                    <h4 class="font-bold text-sm text-gray-700 mb-3">Passagers réservés</h4>
                    <div class="space-y-3">
                        <th:block th:each="res : ${trip.reservations}">
                            <div th:if="${res.status.name() != 'ANNULE' and res.status.name() != 'REFUSE'}"
                                class="flex justify-between items-start bg-gray-50 p-3 rounded-lg text-sm">
                                <div>
                                    <div class="font-semibold text-night" th:text="${res.passengerName}">Jean Dupont
                                    </div>
                                    <div class="text-gray-500 text-xs mt-0.5" th:text="${res.passengerEmail}">
                                        jean@example.com</div>
                                </div>
                                <div class="text-right">
                                    <div class="font-bold text-spring" th:text="${res.passengerPhone}">06 12 34 56 78
                                    </div>
                                    <div class="text-gray-400 text-xs mt-0.5"
                                        th:text="${res.seatsRequested + ' place(s)'}">1 place(s)</div>
                                </div>
                            </div>
                        </th:block>
                        <!-- Show message if all reservations are cancelled -->
                        <div th:if="${trip.reservations.?[status.name() != 'ANNULE' and status.name() != 'REFUSE'].isEmpty()}"
                            class="text-gray-400 text-xs italic">
                            Aucune réservation active.
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(trips)}" class="text-center py-12 bg-white rounded-xl">
                <p class="text-gray-400 mb-4">Vous n'avez aucun trajet actif.</p>
                <a href="/driver/publish" class="text-spring font-bold hover:underline">Publier un trajet maintenant</a>
            </div>
        </div>
    </div>

    <!-- No more modals or scripts needed -->
</body>

</html>
