<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Modifier un trajet - SpringRide</title>
</head>

<body>
    <div layout:fragment="content" class="max-w-4xl mx-auto px-4 py-12">

        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-night mb-2">Modifier mon trajet</h1>
            <p class="text-gray-500">Mettez à jour les informations de votre covoiturage.</p>
        </div>

        <!-- Form Container -->
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">

            <!-- Global Validation Errors -->
            <div th:if="${#fields.hasErrors('${tripRequest.*}')}" class="bg-red-50 p-6 border-b border-red-100">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-red-500" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                                clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <h3 class="text-sm font-medium text-red-800">Erreurs de validation</h3>
                        <div class="mt-2 text-sm text-red-700">
                            <ul class="list-disc pl-5 space-y-1">
                                <li th:each="err : ${#fields.errors('${tripRequest.*}')}" th:text="${err}">Impossible de
                                    valider</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Manually constructing action URL with path variable -->
            <form th:action="@{/driver/trips/{id}/edit(id=${tripId})}" th:object="${tripRequest}" method="post"
                class="p-8 space-y-8">

                <!-- 1. Itinéraire -->
                <section>
                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <span class="bg-spring/10 text-spring p-2 rounded-lg">📍</span> Itinéraire
                    </h2>
                    <!-- Note: Route changes might be restricted in some apps if bookings exist, but assuming allowed here -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 relative">
                        <div class="relative z-10">
                            <label class="block text-sm font-medium text-gray-700 mb-2">De</label>
                            <input type="text" th:field="*{departureCity}"
                                class="block w-full px-4 py-3 rounded-xl border-gray-200 bg-gray-50 text-gray-500 cursor-not-allowed"
                                readonly />
                            <p class="text-xs text-gray-400 mt-1">Lieu de départ non modifiable</p>
                        </div>
                        <div class="relative z-10">
                            <label class="block text-sm font-medium text-gray-700 mb-2">À</label>
                            <input type="text" th:field="*{arrivalCity}"
                                class="block w-full px-4 py-3 rounded-xl border-gray-200 bg-gray-50 text-gray-500 cursor-not-allowed"
                                readonly />
                            <p class="text-xs text-gray-400 mt-1">Lieu d'arrivée non modifiable</p>
                        </div>
                    </div>
                </section>

                <hr class="border-gray-100">

                <!-- 2. Date et Durée -->
                <section>
                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <span class="bg-blue-50 text-blue-600 p-2 rounded-lg">🕒</span> Horaires
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Date et heure de départ</label>
                            <input type="datetime-local" th:field="*{departureDateTime}" required
                                class="block w-full px-4 py-3 rounded-xl border-gray-200 bg-gray-50 focus:bg-white focus:border-spring focus:ring-spring transition sm:text-sm">
                            <p th:if="${#fields.hasErrors('departureDateTime')}" th:errors="*{departureDateTime}"
                                class="text-red-500 text-xs mt-1 font-medium"></p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Durée estimée (minutes)</label>
                            <input type="number" th:field="*{estimatedDuration}" required min="15"
                                class="block w-full px-4 py-3 rounded-xl border-gray-200 bg-gray-50 focus:bg-white focus:border-spring focus:ring-spring transition sm:text-sm">
                        </div>
                    </div>
                </section>

                <hr class="border-gray-100">

                <!-- 3. Détails du trajet -->
                <section>
                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <span class="bg-purple-50 text-purple-600 p-2 rounded-lg">⚙️</span> Détails
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <!-- Places -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Places disponibles</label>
                            <div class="flex items-center border border-gray-200 rounded-xl bg-gray-50 overflow-hidden">
                                <button type="button" onclick="decrement('availableSeats')"
                                    class="px-4 py-3 hover:bg-gray-200 text-gray-600 font-bold">-</button>
                                <input type="number" th:field="*{availableSeats}" id="availableSeats" min="1" max="8"
                                    readonly
                                    class="w-full text-center border-none bg-transparent focus:ring-0 p-0 text-gray-800 font-bold">
                                <button type="button" onclick="increment('availableSeats', 8)"
                                    class="px-4 py-3 hover:bg-gray-200 text-gray-600 font-bold">+</button>
                            </div>
                        </div>

                        <!-- Prix -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Prix par passager</label>
                            <div class="relative rounded-md shadow-sm">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <span class="text-gray-500 sm:text-sm">DH</span>
                                </div>
                                <input type="number" th:field="*{pricePerSeat}" min="0" step="0.5" required
                                    class="block w-full pl-10 px-4 py-3 rounded-xl border-gray-200 bg-gray-50 focus:bg-white focus:border-spring focus:ring-spring transition sm:text-sm font-medium">
                            </div>
                        </div>

                        <!-- Véhicule -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Véhicule</label>
                            <select th:field="*{vehicleId}" required
                                class="block w-full px-4 py-3 rounded-xl border-gray-200 bg-gray-50 focus:bg-white focus:border-spring focus:ring-spring transition sm:text-sm">
                                <option th:each="v : ${vehicles}" th:value="${v.id}"
                                    th:text="${v.brand} + ' ' + ${v.model}"></option>
                            </select>
                        </div>
                    </div>
                </section>

                <!-- Description -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Informations complémentaires</label>
                    <textarea th:field="*{description}" rows="3"
                        class="block w-full px-4 py-3 rounded-xl border-gray-200 bg-gray-50 focus:bg-white focus:border-spring focus:ring-spring transition sm:text-sm"></textarea>
                </div>

                <!-- Buttons -->
                <div class="flex gap-4 pt-4">
                    <a href="/driver/my-trips"
                        class="flex-1 text-center py-4 px-4 border border-gray-300 rounded-xl text-lg font-bold text-gray-700 hover:bg-gray-50 transition">
                        Annuler
                    </a>
                    <button type="submit"
                        class="flex-1 py-4 px-4 border border-transparent rounded-xl shadow-lg text-lg font-bold text-white bg-spring hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-spring transition transform hover:-translate-y-0.5">
                        Enregistrer les modifications
                    </button>
                </div>

            </form>
        </div>

        <script>
            function increment(id, max) {
                const el = document.getElementById(id);
                let val = parseInt(el.value);
                if (val < max) el.value = val + 1;
            }
            function decrement(id) {
                const el = document.getElementById(id);
                let val = parseInt(el.value);
                if (val > 1) el.value = val - 1;
            }
        </script>
    </div>
</body>

</html>
