<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Vérification du Compte - Spring Ride</title>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">
    <div th:replace="~{fragments/layout-fragments :: header}"></div>

    <div class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <h2 class="text-3xl font-bold text-center mb-4 text-night">Vérification du Compte</h2>
            <p class="text-center text-gray-600 mb-8">Un code a été envoyé à votre adresse email.</p>

            <!-- Success/Error Messages -->
            <div th:if="${success}" class="mb-4 text-center text-green-600 font-bold" th:text="${success}"></div>
            <div th:if="${error}" class="mb-4 text-center text-red-600 font-bold" th:text="${error}"></div>

            <form th:action="@{/verify-account}" method="post">
                <input type="hidden" name="email" th:value="${email != null ? email : param.email}">

                <div class="mb-6">
                    <label for="code" class="block text-sm font-medium text-gray-700 mb-2">Code de vérification (6
                        chiffres)</label>
                    <input type="text" id="code" name="code" maxlength="6"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-spring focus:border-spring text-center text-2xl tracking-widest"
                        required>
                </div>

                <button type="submit"
                    class="w-full bg-spring text-white font-bold py-3 rounded-lg hover:bg-green-500 transition shadow-lg">
                    Vérifier
                </button>
            </form>

            <div class="mt-6 text-center">
                <form th:action="@{/resend-otp}" method="post" class="inline">
                    <input type="hidden" name="email" th:value="${email != null ? email : param.email}">
                    <button type="submit"
                        class="text-sm text-gray-500 hover:text-spring bg-transparent border-0 cursor-pointer">
                        Renvoyer le code
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout-fragments :: footer}"></div>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { spring: '#00D084', night: '#0F172A' } }
            }
        }
    </script>
</body>

</html>
