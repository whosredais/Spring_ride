<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Vérification du Compte - Spring Ride</title>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">
    <div th:replace="~{fragments/layout-fragments :: header}"></div>

    <div class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <h2 class="text-3xl font-bold text-center mb-4 text-night">Vérification du Compte</h2>
            <p class="text-center text-gray-600 mb-8">Un code a été envoyé à votre adresse email.</p>

            <form id="verifyForm">
                <input type="hidden" id="email" th:value="${param.email}">

                <div class="mb-6">
                    <label for="code" class="block text-sm font-medium text-gray-700 mb-2">Code de vérification (6
                        chiffres)</label>
                    <input type="text" id="code" name="code" maxlength="6"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-spring focus:border-spring text-center text-2xl tracking-widest"
                        required>
                </div>

                <div id="message" class="mb-4 text-center hidden"></div>

                <button type="submit"
                    class="w-full bg-spring text-white font-bold py-3 rounded-lg hover:bg-green-500 transition shadow-lg">
                    Vérifier
                </button>
            </form>

            <div class="mt-6 text-center">
                <button id="resendBtn" class="text-sm text-gray-500 hover:text-spring">Renvoyer le code</button>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout-fragments :: footer}"></div>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { spring: '#00D084', night: '#0F172A' } }
            }
        }

        const form = document.getElementById('verifyForm');
        const messageDiv = document.getElementById('message');
        const resendBtn = document.getElementById('resendBtn');
        const email = document.getElementById('email').value || prompt("Veuillez confirmer votre email :");

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('code').value;

            try {
                const response = await fetch('/api/auth/verify-account', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code })
                });

                messageDiv.classList.remove('hidden');

                if (response.ok) {
                    const text = await response.text();
                    messageDiv.className = 'mb-4 text-center text-green-600 font-bold';
                    messageDiv.innerText = text;
                    setTimeout(() => window.location.href = '/login', 2000);
                } else {
                    const data = await response.json();
                    messageDiv.className = 'mb-4 text-center text-red-600';
                    messageDiv.innerText = "Erreur: " + (data.message || "Code invalide");
                }
            } catch (error) {
                console.error(error);
                messageDiv.className = 'mb-4 text-center text-red-600';
                messageDiv.innerText = "Erreur de connexion.";
            }
        });

        resendBtn.addEventListener('click', async () => {
            try {
                const response = await fetch('/api/auth/resend-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                alert(await response.text());
            } catch (error) {
                alert("Erreur lors de l'envoi.");
            }
        });
    </script>
</body>

</html>
