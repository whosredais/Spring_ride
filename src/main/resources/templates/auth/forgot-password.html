<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Mot de passe oublié - Spring Ride</title>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">
    <div th:replace="~{fragments/layout-fragments :: header}"></div>

    <div class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <h2 class="text-3xl font-bold text-center mb-8 text-night">Réinitialisation</h2>

            <!-- Success/Error Messages -->
            <div th:if="${success}" class="mb-4 text-center text-green-600 font-bold" th:text="${success}"></div>
            <div th:if="${error}" class="mb-4 text-center text-red-600 font-bold" th:text="${error}"></div>

            <form th:action="@{/forgot-password}" method="post">
                <div class="mb-6">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Votre Email</label>
                    <input type="email" id="email" name="email"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-spring focus:border-spring"
                        required>
                </div>

                <button type="submit"
                    class="w-full bg-spring text-white font-bold py-3 rounded-lg hover:bg-green-500 transition shadow-lg">
                    Envoyer le code
                </button>
            </form>

            <p class="mt-6 text-center text-gray-600">
                <a href="/login" class="text-spring font-bold hover:underline">Retour</a>
            </p>
        </div>
    </div>

    <div th:replace="~{fragments/layout-fragments :: footer}"></div>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { spring: '#00D084', night: '#0F172A' } }
            }
        }
    </script>
</body>

</html>
