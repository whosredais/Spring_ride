<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Connexion</title>
</head>

<body>
    <div layout:fragment="content"
        class="min-h-[calc(100vh-64px)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-50">
        <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl">
            <div class="text-center">
                <h2 class="mt-6 text-3xl font-extrabold text-night">Bienvenue</h2>
                <p class="mt-2 text-sm text-gray-600">Connectez-vous à votre compte</p>
            </div>

            <div th:if="${param.error}" class="bg-red-50 text-red-500 p-4 rounded-lg text-sm text-center">
                Identifiants incorrects.
            </div>
            <div th:if="${param.logout}" class="bg-green-50 text-green-500 p-4 rounded-lg text-sm text-center">
                Vous avez été déconnecté.
            </div>

            <form class="mt-8 space-y-6" th:action="@{/login}" method="post" th:object="${loginRequest}">
                <div class="rounded-md shadow-sm -space-y-px">
                    <div>
                        <label for="username" class="sr-only">Email</label>
                        <input id="username" name="username" type="email" required
                            class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-lg focus:outline-none focus:ring-spring focus:border-spring focus:z-10 sm:text-sm"
                            placeholder="Email" th:field="*{username}">
                    </div>
                    <div>
                        <label for="password" class="sr-only">Mot de passe</label>
                        <input id="password" name="password" type="password" required
                            class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-lg focus:outline-none focus:ring-spring focus:border-spring focus:z-10 sm:text-sm"
                            placeholder="Mot de passe" th:field="*{password}">
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-spring hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-spring transition transform hover:-translate-y-0.5 shadow-md">
                        Se connecter
                    </button>
                </div>
            </form>
            <div class="text-center mt-4">
                <a href="/register" class="text-sm text-spring hover:underline">Pas encore de compte ? S'inscrire</a>
            </div>
        </div>
    </div>
</body>

</html>
