<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Inscription</title>
</head>

<body>
    <div layout:fragment="content"
        class="min-h-[calc(100vh-64px)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-50">
        <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl">
            <div class="text-center">
                <h2 class="mt-6 text-3xl font-extrabold text-night">Créer un compte</h2>
                <p class="mt-2 text-sm text-gray-600">Rejoignez la communauté SpringRide</p>
            </div>

            <form class="mt-8 space-y-6" th:action="@{/register}" method="post" th:object="${registerRequest}">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="sr-only">Prénom</label>
                        <input type="text" required
                            class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 focus:outline-none focus:ring-spring focus:border-spring sm:text-sm"
                            placeholder="Prénom" th:field="*{firstname}">
                    </div>
                    <div>
                        <label class="sr-only">Nom</label>
                        <input type="text" required
                            class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 focus:outline-none focus:ring-spring focus:border-spring sm:text-sm"
                            placeholder="Nom" th:field="*{lastname}">
                    </div>
                </div>

                <div>
                    <label class="sr-only">Email</label>
                    <input type="email" required
                        class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 focus:outline-none focus:ring-spring focus:border-spring sm:text-sm"
                        placeholder="Email" th:field="*{email}">
                </div>

                <div>
                    <label class="sr-only">Téléphone</label>
                    <input type="tel"
                        class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 focus:outline-none focus:ring-spring focus:border-spring sm:text-sm"
                        placeholder="Téléphone" th:field="*{phone}">
                </div>

                <div>
                    <label class="sr-only">Mot de passe</label>
                    <input type="password" required
                        class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 focus:outline-none focus:ring-spring focus:border-spring sm:text-sm"
                        placeholder="Mot de passe" th:field="*{password}">
                </div>

                <div>
                    <button type="submit"
                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-spring hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-spring transition transform hover:-translate-y-0.5 shadow-md">
                        S'inscrire
                    </button>
                </div>
            </form>
            <div class="text-center mt-4">
                <a href="/login" class="text-sm text-spring hover:underline">Déjà un compte ? Se connecter</a>
            </div>
        </div>
    </div>
</body>

</html>
