<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Nouveau mot de passe - Spring Ride</title>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">
    <div th:replace="~{fragments/layout-fragments :: header}"></div>

    <div class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <h2 class="text-3xl font-bold text-center mb-8 text-night">Nouveau Mot de Passe</h2>

            <form id="resetForm">
                <input type="hidden" id="email" th:value="${param.email}">

                <div class="mb-6">
                    <label for="code" class="block text-sm font-medium text-gray-700 mb-2">Code reçu par email</label>
                    <input type="text" id="code" name="code" maxlength="6"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-spring focus:border-spring text-center text-xl"
                        required>
                </div>

                <div class="mb-6">
                    <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-2">Nouveau mot de
                        passe</label>
                    <input type="password" id="newPassword" name="newPassword"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-spring focus:border-spring"
                        required>
                </div>

                <div id="message" class="mb-4 text-center hidden"></div>

                <button type="submit"
                    class="w-full bg-spring text-white font-bold py-3 rounded-lg hover:bg-green-500 transition shadow-lg">
                    Changer le mot de passe
                </button>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/layout-fragments :: footer}"></div>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { spring: '#00D084', night: '#0F172A' } }
            }
        }

        const form = document.getElementById('resetForm');
        const messageDiv = document.getElementById('message');
        const email = document.getElementById('email').value || prompt("Veuillez confirmer votre email :");

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('code').value;
            const newPassword = document.getElementById('newPassword').value;

            try {
                console.log('Sending reset request with:', { email, code, newPassword: '***' });
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, newPassword })
                });

                messageDiv.classList.remove('hidden');

                if (response.ok) {
                    const text = await response.text();
                    messageDiv.className = 'mb-4 text-center text-green-600 font-bold';
                    messageDiv.innerText = text;
                    setTimeout(() => window.location.href = '/login', 2000);
                } else {
                    const data = await response.json();
                    console.error('Error response:', data);
                    messageDiv.className = 'mb-4 text-center text-red-600';
                    messageDiv.innerText = data.message || "Une erreur est survenue";
                }
            } catch (error) {
                console.error('Exception:', error);
                messageDiv.classList.remove('hidden');
                messageDiv.className = 'mb-4 text-center text-red-600';
                messageDiv.innerText = "Erreur de connexion: " + error.message;
            }
        });
    </script>
</body>

</html>
