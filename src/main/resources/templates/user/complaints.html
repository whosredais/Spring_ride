<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Mes Réclamations</title>
</head>

<body>

    <div layout:fragment="content" class="container mx-auto px-4 py-8 max-w-5xl">

        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-night">Mes Réclamations</h1>
            <button onclick="document.getElementById('newReportModal').classList.remove('hidden')"
                class="bg-spring text-white px-4 py-2 rounded-lg font-semibold hover:bg-green-600 transition">
                Nouvelle Réclamation
            </button>
        </div>

        <!-- Alert Messages -->
        <div th:if="${successMessage}"
            class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4">
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}"
            class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Reports List -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <table class="min-w-full leading-normal">
                <thead>
                    <tr>
                        <th
                            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            Date
                        </th>
                        <th
                            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            Utilisateur Signalé
                        </th>
                        <th
                            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            Raison
                        </th>
                        <th
                            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            Trajet
                        </th>
                        <th
                            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            Statut
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="report : ${reports}">
                        <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                            <p class="text-gray-900 whitespace-no-wrap"
                                th:text="${#temporals.format(report.createdAt, 'dd/MM/yyyy HH:mm')}"></p>
                        </td>
                        <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                            <div class="flex items-center">
                                <div class="ml-3">
                                    <p class="text-gray-900 whitespace-no-wrap"
                                        th:text="${report.reportedUser.firstname + ' ' + report.reportedUser.lastname}">
                                    </p>
                                </div>
                            </div>
                        </td>
                        <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                            <p class="text-gray-900 whitespace-no-wrap" th:text="${report.reason}"></p>
                        </td>
                        <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                            <span th:if="${report.trip}"
                                th:text="${report.trip.departureCity + ' -> ' + report.trip.arrivalCity}"></span>
                            <span th:unless="${report.trip}" class="text-gray-400">-</span>
                        </td>
                        <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                            <span
                                th:class="${'px-2 inline-flex text-xs leading-5 font-semibold rounded-full ' + 
                            (report.status.name() == 'RESOLVED' ? 'bg-green-100 text-green-800' : 
                            (report.status.name() == 'DISMISSED' ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800'))}">
                                <span th:text="${report.status}"></span>
                            </span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(reports)}">
                        <td colspan="5" class="px-5 py-5 border-b border-gray-200 bg-white text-sm text-center">
                            Aucune réclamation trouvée.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal for New Report -->
    <div id="newReportModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden"
        x-show="open">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg leading-6 font-medium text-gray-900">Signaler un problème</h3>
                <form th:action="@{/reports/submit}" method="post" class="mt-2 text-left">
                    <!-- NOTE: Ideally this ID comes from context, but manual entry for now as requested -->
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="reportedUserId">
                            ID Utilisateur à signaler
                        </label>
                        <input type="number" name="reportedUserId" id="reportedUserId" required
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    </div>

                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="tripId">
                            ID Trajet (Optionnel)
                        </label>
                        <input type="number" name="tripId" id="tripId"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    </div>

                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="reason">
                            Raison
                        </label>
                        <textarea name="reason" id="reason" required rows="3"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"></textarea>
                    </div>

                    <div class="items-center px-4 py-3">
                        <button type="submit"
                            class="px-4 py-2 bg-spring text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-300">
                            Envoyer
                        </button>
                        <button type="button"
                            onclick="document.getElementById('newReportModal').classList.add('hidden')"
                            class="mt-3 px-4 py-2 bg-gray-100 text-gray-700 text-base font-medium rounded-md w-full shadow-sm hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-300">
                            Annuler
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
