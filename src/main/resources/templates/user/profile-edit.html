<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Modifier mon profil</title>
</head>

<body>
    <div layout:fragment="content" class="max-w-2xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-night mb-8">Modifier mon profil</h1>

        <form th:action="@{/profile/edit}" method="post" enctype="multipart/form-data" th:object="${profileRequest}"
            class="bg-white rounded-xl shadow-lg border border-gray-100 p-8">

            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">Photo de profil</label>
                <input type="file" th:field="*{profilePicture}" accept="image/*"
                    class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:border-spring focus:ring-2 focus:ring-spring/20 outline-none transition" />
                <p class="text-xs text-gray-400 mt-1">Formats acceptés : JPG, PNG. Max 5MB.</p>
            </div>

            <div class="grid grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Prénom</label>
                    <input type="text" th:field="*{firstname}" required
                        class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:border-spring focus:ring-2 focus:ring-spring/20 outline-none transition" />
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Nom</label>
                    <input type="text" th:field="*{lastname}" required
                        class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:border-spring focus:ring-2 focus:ring-spring/20 outline-none transition" />
                </div>
            </div>

            <div class="mb-8">
                <label class="block text-sm font-bold text-gray-700 mb-2">Téléphone</label>
                <input type="tel" th:field="*{phone}"
                    class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:border-spring focus:ring-2 focus:ring-spring/20 outline-none transition" />
            </div>

            <div class="flex justify-end gap-4">
                <a th:href="@{/profile}"
                    class="px-6 py-2 rounded-lg font-bold text-gray-600 hover:bg-gray-50 transition">
                    Annuler
                </a>
                <button type="submit"
                    class="px-6 py-2 bg-spring text-white rounded-lg font-bold hover:bg-green-600 transition shadow-lg shadow-green-200">
                    Enregistrer
                </button>
            </div>
        </form>
    </div>
</body>

</html>
