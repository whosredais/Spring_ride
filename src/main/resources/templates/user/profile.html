<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Mon Profil</title>
</head>

<body>
    <div layout:fragment="content" class="max-w-2xl mx-auto px-4 py-8">

        <div class="bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden">
            <div class="bg-night h-32 relative">
                <div class="absolute -bottom-12 left-8">
                    <div class="w-24 h-24 bg-white p-1 rounded-full overflow-hidden">
                        <img th:if="${user.profilePicture != null}" th:src="@{'/uploads/' + ${user.profilePicture}}"
                            class="w-full h-full object-cover rounded-full" alt="Profile" />
                        <div th:unless="${user.profilePicture != null}"
                            class="w-full h-full bg-gray-200 rounded-full flex items-center justify-center text-3xl font-bold text-gray-500">
                            <span th:text="${user.firstname.substring(0,1)}">U</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pt-16 pb-8 px-8">
                <h1 class="text-3xl font-bold text-night mb-1">
                    <span th:text="${user.firstname}">Jean</span> <span th:text="${user.lastname}">Dupont</span>
                </h1>
                <p class="text-gray-500 mb-6" th:text="${user.email}">jean@example.com</p>

                <div class="grid grid-cols-2 gap-4 border-t border-b border-gray-100 py-6 mb-6">
                    <div class="text-center">
                        <span class="block text-2xl font-bold text-spring" th:text="${user.averageRating}">4.8</span>
                        <span class="text-xs text-gray-500 uppercase">Note Moyenne</span>
                    </div>
                    <div class="text-center border-l border-gray-100">
                        <span class="block text-2xl font-bold text-night" th:text="${user.reviewCount}">12</span>
                        <span class="text-xs text-gray-500 uppercase">Avis reçus</span>
                    </div>
                </div>

                <div class="space-y-4">
                    <h3 class="font-bold text-gray-900 border-b pb-2">Informations Personnelles</h3>
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div>
                            <p class="text-gray-500">Téléphone</p>
                            <p class="font-medium" th:text="${user.phone ?: 'Non renseigné'}">06 12 34 56 78</p>
                        </div>
                        <div>
                            <p class="text-gray-500">Membre depuis</p>
                            <p class="font-medium">Décembre 2025</p>
                        </div>
                    </div>
                </div>

                <div class="mt-8 flex justify-end">
                    <a th:href="@{/profile/edit}" class="text-gray-400 hover:text-night text-sm font-medium">Modifier
                        mon profil</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
