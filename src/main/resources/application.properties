# src/main/resources/application.properties
spring.application.name=SpringRideConnect

# Profil par défaut = dev (H2 en mémoire)
# Profil par défaut = mysql
spring.profiles.active=mysql

# ====================== PROFIL DEV (H2) ======================
spring.datasource.url=jdbc:h2:mem:springride
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=


spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ====================== JWT ======================
app.jwt.secret=amirasalimreda2025springrideapplicationkey
app.jwt.expiration=86400000